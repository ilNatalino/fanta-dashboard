<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROTOTYPE — Dashboard asta</title>
  <style>
    /* PROTOTYPE — Tre varianti della dashboard d'asta, selezionabili con ?variant=A|B|C. */
    :root {
      --ink: #17201c;
      --muted: #66706b;
      --line: #d9dfdb;
      --paper: #f6f7f3;
      --panel: #ffffff;
      --green: #123c2f;
      --mint: #c8f56a;
      --orange: #ff6b35;
      --blue: #3f63d4;
      --shadow: 0 14px 40px rgb(23 32 28 / 10%);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: var(--ink);
      background: var(--paper);
      font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .prototype-app { min-height: 100vh; padding-bottom: 84px; }
    .eyebrow { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; }
    .number { font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); }
    .strong { font-weight: 800; }
    .divider { height: 1px; background: var(--line); }
    .pill {
      display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 4px 9px;
      border: 1px solid var(--line); border-radius: 999px; background: #fff; font-size: 12px; font-weight: 700;
    }
    .pill.dark { border-color: var(--green); color: #fff; background: var(--green); }
    .pill.mint { border-color: #b2d75f; background: #eefbd2; }
    .pill.orange { border-color: #ffd4c3; color: #a93810; background: #fff0ea; }
    .button {
      min-height: 42px; padding: 10px 16px; border: 1px solid transparent; border-radius: 10px;
      background: var(--green); color: #fff; font-weight: 800;
    }
    .button:hover { filter: brightness(1.08); }
    .button.secondary { border-color: var(--line); color: var(--ink); background: #fff; }
    .button.orange { background: var(--orange); }
    .icon-button {
      width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--line);
      border-radius: 9px; background: #fff; color: var(--ink); font-weight: 900;
    }
    .search {
      width: 100%; height: 44px; padding: 0 14px 0 40px; border: 1px solid var(--line);
      border-radius: 10px; outline: none; background: #fff;
    }
    .search:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgb(63 99 212 / 12%); }
    .search-wrap { position: relative; }
    .search-wrap::before { content: "⌕"; position: absolute; left: 14px; top: 9px; font-size: 20px; color: var(--muted); }
    .search-results {
      position: absolute; z-index: 20; top: 50px; left: 0; right: 0; display: none; overflow: hidden;
      border: 1px solid var(--line); border-radius: 12px; background: #fff; box-shadow: var(--shadow);
    }
    .search-results.open { display: block; }
    .search-result { width: 100%; padding: 11px 14px; border: 0; border-bottom: 1px solid var(--line); background: #fff; text-align: left; }
    .search-result:hover { background: #f1f5f2; }

    /* Variant A — command center */
    .a-shell { min-height: calc(100vh - 84px); background: #eef1ed; }
    .a-topbar {
      height: 66px; display: grid; grid-template-columns: 190px auto minmax(320px, 1fr) auto; gap: 18px;
      position: sticky; z-index: 40; top: 0; align-items: center; padding: 0 22px; border-bottom: 1px solid #cad1cc; background: #fff;
    }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 17px; font-weight: 900; }
    .brand-mark { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 8px; background: var(--green); color: var(--mint); }
    .a-nav { display: flex; gap: 3px; padding: 3px; border-radius: 10px; background: #eef1ed; }
    .a-nav button { padding: 7px 10px; border: 0; border-radius: 7px; color: var(--muted); background: transparent; font-size: 12px; font-weight: 800; }
    .a-nav button.active { color: #fff; background: var(--green); }
    .a-status { display: flex; justify-content: flex-end; gap: 7px; }
    .a-grid { display: grid; grid-template-columns: 248px minmax(500px, 1fr) 372px; gap: 12px; padding: 12px; }
    .a-panel { min-height: calc(100vh - 174px); border: 1px solid #d5dbd7; border-radius: 14px; background: #fff; }
    .a-roster-panel { height: calc(100vh - 174px); display: flex; flex-direction: column; overflow: hidden; }
    .a-panel-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 16px 12px; }
    .role-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 0 12px 12px; }
    .role-tab { padding: 8px 4px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 12px; font-weight: 800; }
    .role-tab.active { border-color: var(--green); color: #fff; background: var(--green); }
    .scarcity { display: flex; flex-wrap: wrap; gap: 5px; padding: 10px 14px; border-block: 1px solid var(--line); background: #f8faf8; }
    .scarcity span { font-size: 11px; color: var(--muted); }
    .ranking-row { display: grid; grid-template-columns: 24px 1fr auto; gap: 9px; align-items: center; padding: 12px 14px; border-bottom: 1px solid #edf0ee; }
    .ranking-row.selected { box-shadow: inset 3px 0 var(--orange); background: #fff6f1; }
    .rank { color: #929a95; font-size: 12px; font-weight: 800; }
    .player-mini { min-width: 0; }
    .player-mini strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .player-mini span { color: var(--muted); font-size: 11px; }
    .price-mini { font-size: 16px; font-weight: 900; }
    .a-main { padding: 22px 24px; background: #fcfdfb; }
    .called-header { display: flex; justify-content: space-between; align-items: start; gap: 18px; }
    .called-name { margin: 7px 0 4px; font-size: clamp(28px, 3vw, 42px); line-height: 1; letter-spacing: -.04em; }
    .called-meta { display: flex; flex-wrap: wrap; gap: 7px; }
    .market-strip { display: grid; grid-template-columns: repeat(3, 1fr); margin: 24px 0 18px; border: 1px solid var(--line); border-radius: 13px; background: #fff; }
    .market-stat { padding: 16px; border-right: 1px solid var(--line); }
    .market-stat:last-child { border-right: 0; }
    .market-stat strong { display: block; margin-top: 6px; font-size: 26px; letter-spacing: -.04em; }
    .market-stat.adapted { color: #fff; background: var(--green); }
    .market-stat:first-child { border-radius: 12px 0 0 12px; }
    .market-stat:last-child { border-radius: 0 12px 12px 0; }
    .player-signal { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .signal { padding: 14px; border: 1px solid var(--line); border-radius: 11px; background: #fff; }
    .signal-meter { height: 7px; margin-top: 9px; overflow: hidden; border-radius: 999px; background: #edf0ee; }
    .signal-meter i { display: block; height: 100%; border-radius: inherit; background: var(--blue); }
    .alternatives { margin-top: 20px; }
    .alternative-row { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
    .a-action { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
    .a-action .button { min-width: 170px; }
    .budget-hero { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 4px 16px 15px; padding: 17px; border-radius: 12px; color: #fff; background: var(--green); }
    .budget-hero strong { display: block; margin: 4px 0; font-size: 34px; line-height: 1; }
    .budget-hero > div + div { padding-left: 14px; border-left: 1px solid rgb(255 255 255 / 24%); }
    .budget-hero > small { grid-column: 1 / -1; color: #c8d8d2; }
    .bar { height: 7px; overflow: hidden; border-radius: 999px; background: #e9ecea; }
    .bar i { display: block; height: 100%; border-radius: inherit; background: var(--green); }
    .roster-list { margin-top: 12px; border-top: 1px solid var(--line); }
    .a-roster-panel .roster-list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
    .roster-row { display: grid; grid-template-columns: 1fr auto; padding: 11px 16px; border-bottom: 1px solid #edf0ee; }
    .roster-role-label { padding: 9px 16px 5px; color: var(--muted); background: #f8faf8; font-size: 10px; font-weight: 900; letter-spacing: .1em; }
    .a-page { min-height: calc(100vh - 150px); padding: 20px 22px; background: #eef1ed; }
    .a-page-title { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 16px; }
    .a-page-title h1 { margin: 5px 0 0; font-size: 32px; letter-spacing: -.04em; }
    .roster-summary { display: grid; grid-template-columns: 1.3fr repeat(3, 1fr); overflow: hidden; margin-bottom: 14px; border: 1px solid #d5dbd7; border-radius: 14px; background: #fff; }
    .roster-summary > div { padding: 17px 19px; border-right: 1px solid var(--line); }
    .roster-summary > div:last-child { border-right: 0; }
    .roster-summary strong { display: block; margin-top: 4px; font-size: 25px; }
    .slot-overview { display: grid; grid-template-columns: .8fr 1.2fr; gap: 12px; margin-bottom: 14px; }
    .slot-panel { overflow: hidden; border: 1px solid #d5dbd7; border-radius: 14px; background: #fff; }
    .slot-panel-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .slot-matrix-row { display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: center; min-height: 46px; padding: 8px 16px; border-bottom: 1px solid #edf0ee; }
    .slot-matrix-row:last-child { border-bottom: 0; }
    .slot-matrix-row > strong { font-size: 12px; }
    .slot-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .slot-chip { padding: 5px 8px; border-radius: 7px; color: var(--green); background: #eefbd2; font-size: 11px; font-weight: 800; }
    .slot-chip.available { color: var(--muted); background: #f1f3f1; }
    .slot-chip.zero { color: #9ba39f; background: #fff; box-shadow: inset 0 0 0 1px #e2e6e3; }
    .roster-board { display: grid; grid-template-columns: 1fr 2fr 2fr 1.6fr; gap: 12px; }
    .role-lane { min-height: 480px; overflow: hidden; border: 1px solid #d5dbd7; border-radius: 14px; background: #fff; }
    .role-lane-head { display: flex; justify-content: space-between; padding: 15px; color: #fff; background: var(--green); }
    .role-lane-metrics { display: grid; justify-items: end; line-height: 1.15; }
    .role-lane-metrics b { font-size: 13px; }
    .role-lane-metrics small { margin-top: 4px; color: #bcd1c8; }
    .roster-player { margin: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .roster-player strong { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 3px; }
    .empty-slot { margin: 8px 10px; padding: 9px 11px; border: 1px dashed #cbd2ce; border-radius: 9px; color: #9aa39e; font-size: 12px; }
    .teams-layout { display: grid; grid-template-columns: minmax(620px, 1fr) 360px; gap: 12px; }
    .teams-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; align-content: start; }
    .team-card { padding: 15px; border: 1px solid #d5dbd7; border-radius: 13px; background: #fff; text-align: left; }
    .team-card.selected { border-color: var(--orange); box-shadow: inset 0 0 0 2px var(--orange); }
    .team-card-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
    .team-card-head strong:last-child { font-size: 21px; }
    .team-slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .team-slots span { padding: 6px; border-radius: 6px; color: var(--muted); background: #f1f3f1; font-size: 10px; font-weight: 800; text-align: center; }
    .team-inspector { min-height: 500px; border: 1px solid #d5dbd7; border-radius: 14px; background: #fff; }
    .team-inspector-head { padding: 18px; color: #fff; background: var(--green); border-radius: 13px 13px 0 0; }
    .team-inspector-head h2 { margin: 5px 0 2px; }

    /* Variant B — focus mode */
    .b-shell { min-height: calc(100vh - 84px); color: #f8fbf9; background: #0e2019; }
    .b-header { display: grid; grid-template-columns: auto minmax(350px, 720px) auto; gap: 24px; align-items: center; padding: 20px 30px; }
    .b-header .brand-mark { background: var(--mint); color: var(--green); }
    .b-header .search { height: 52px; border: 1px solid #466057; color: #fff; background: #18342a; }
    .b-header .search::placeholder { color: #9eafa8; }
    .b-header .search-wrap::before { color: var(--mint); top: 13px; }
    .live-marker { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 800; }
    .live-marker i { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 0 5px rgb(255 107 53 / 16%); }
    .b-stage { width: min(1180px, calc(100% - 56px)); margin: 18px auto 0; }
    .b-context { display: flex; justify-content: space-between; align-items: center; color: #aebdb7; }
    .b-context .scarcity-inline { word-spacing: 8px; }
    .b-player { display: grid; grid-template-columns: 1fr 440px; gap: 60px; align-items: center; padding: 66px 0 44px; }
    .b-player h1 { margin: 10px 0 12px; font-size: clamp(48px, 7vw, 86px); line-height: .91; letter-spacing: -.065em; }
    .b-tags { display: flex; gap: 8px; }
    .b-tags .pill { border-color: #496158; color: #eaf0ed; background: #193129; }
    .b-price-orbit { position: relative; display: grid; place-items: center; aspect-ratio: 1; border: 1px solid #3a554b; border-radius: 50%; }
    .b-price-orbit::before, .b-price-orbit::after { content: ""; position: absolute; border: 1px solid #294239; border-radius: 50%; }
    .b-price-orbit::before { inset: 32px; }
    .b-price-orbit::after { inset: 64px; }
    .b-price-center { position: relative; z-index: 1; text-align: center; }
    .b-price-center strong { display: block; color: var(--mint); font-size: 82px; line-height: .9; letter-spacing: -.08em; }
    .b-price-center span { display: block; margin-top: 9px; color: #b5c3bd; }
    .b-price-labels { position: absolute; inset: 0; }
    .orbit-label { position: absolute; min-width: 118px; padding: 10px 13px; border: 1px solid #496158; border-radius: 10px; background: #173027; box-shadow: 0 12px 28px rgb(0 0 0 / 20%); }
    .orbit-label strong { display: block; color: #fff; font-size: 20px; }
    .orbit-label.pma { left: -20px; top: 82px; }
    .orbit-label.pfc { right: -12px; top: 92px; }
    .orbit-label.max { right: 16px; bottom: 40px; }
    .b-command { display: flex; align-items: center; gap: 12px; }
    .b-command .button { min-width: 180px; color: var(--green); background: var(--mint); }
    .b-command .button.secondary { border-color: #476057; color: #fff; background: transparent; }
    .b-dock { display: grid; grid-template-columns: 1.1fr 1fr 1fr; border-top: 1px solid #314b41; border-bottom: 1px solid #314b41; }
    .b-dock-section { min-height: 170px; padding: 22px 26px; border-right: 1px solid #314b41; }
    .b-dock-section:last-child { border-right: 0; }
    .b-dock-section h3 { margin: 5px 0 14px; font-size: 16px; }
    .b-alt { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #294239; }
    .b-budget-line { display: flex; justify-content: space-between; align-items: end; margin-bottom: 13px; }
    .b-budget-line strong { color: var(--mint); font-size: 34px; }
    .b-meter { height: 8px; border-radius: 999px; background: #294239; }
    .b-meter i { display: block; width: 10%; height: 100%; border-radius: inherit; background: var(--mint); }
    .b-shortlist { display: flex; flex-wrap: wrap; gap: 8px; }
    .b-shortlist button { padding: 8px 11px; border: 1px solid #466057; border-radius: 999px; color: #dbe4e0; background: transparent; }
    .b-shortlist button.active { border-color: var(--mint); color: var(--green); background: var(--mint); }

    /* Variant C — data table */
    .c-shell { min-height: calc(100vh - 84px); background: #f7f4ed; }
    .c-header { height: 62px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; border-bottom: 2px solid #222; background: #f7f4ed; }
    .c-nav { display: flex; gap: 4px; }
    .c-nav button { padding: 8px 13px; border: 1px solid #aaa69c; background: transparent; font-weight: 800; }
    .c-nav button.active { color: #fff; background: #222; }
    .c-grid { display: grid; grid-template-columns: minmax(650px, 1fr) 390px; min-height: calc(100vh - 146px); }
    .c-table-area { padding: 18px 16px; border-right: 2px solid #222; }
    .c-tools { display: grid; grid-template-columns: minmax(260px, 1fr) auto auto; gap: 8px; margin-bottom: 12px; }
    .c-tools select { padding: 0 10px; border: 1px solid #8d8a82; background: #fffef9; }
    .c-table { width: 100%; border-collapse: collapse; background: #fffef9; }
    .c-table th { padding: 9px 8px; border: 1px solid #aaa69c; background: #e8e4db; font-size: 10px; letter-spacing: .08em; text-align: left; text-transform: uppercase; }
    .c-table td { padding: 10px 8px; border: 1px solid #c9c5bc; }
    .c-table tr.selected td { background: #fff0a8; }
    .c-table tr:hover td { background: #f3f0e8; }
    .c-table tr.selected:hover td { background: #fff0a8; }
    .c-side { background: #fffef9; }
    .c-inspector-head { padding: 18px; border-bottom: 1px solid #aaa69c; }
    .c-inspector-head h1 { margin: 6px 0 4px; font-family: Georgia, serif; font-size: 31px; line-height: 1.05; }
    .c-block { padding: 16px 18px; border-bottom: 1px solid #aaa69c; }
    .c-price-grid { display: grid; grid-template-columns: repeat(2, 1fr); border-top: 1px solid #aaa69c; border-left: 1px solid #aaa69c; }
    .c-price { padding: 11px; border-right: 1px solid #aaa69c; border-bottom: 1px solid #aaa69c; }
    .c-price strong { display: block; margin-top: 2px; font-size: 24px; }
    .c-alt { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 7px 0; border-bottom: 1px dotted #aaa69c; }
    .c-action { display: grid; grid-template-columns: 1fr auto; gap: 9px; }
    .c-action .button { border-radius: 0; background: #222; }
    .c-action .button.secondary { color: #222; background: #fffef9; }

    /* Modal and prototype switcher */
    .modal-backdrop { position: fixed; z-index: 90; inset: 0; display: none; place-items: center; padding: 24px; background: rgb(13 24 19 / 68%); }
    .modal-backdrop.open { display: grid; }
    .modal { width: min(460px, 100%); border-radius: 16px; background: #fff; box-shadow: 0 28px 80px rgb(0 0 0 / 35%); }
    .modal-head, .modal-body, .modal-actions { padding: 18px 20px; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
    .modal-head h2 { margin: 0; font-size: 20px; }
    .modal-body { display: grid; gap: 15px; }
    .field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 800; }
    .field select, .field input { width: 100%; height: 44px; padding: 0 11px; border: 1px solid var(--line); border-radius: 9px; background: #fff; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 9px; border-top: 1px solid var(--line); }
    .toast { position: fixed; z-index: 100; right: 22px; bottom: 86px; display: none; padding: 12px 16px; border-radius: 10px; color: #fff; background: var(--green); box-shadow: var(--shadow); }
    .toast.open { display: block; }
    .prototype-switcher {
      position: fixed; z-index: 80; left: 50%; bottom: 18px; transform: translateX(-50%); display: grid;
      grid-template-columns: 42px minmax(220px, auto) 42px; align-items: center; overflow: hidden;
      border: 1px solid #53625c; border-radius: 999px; color: #fff; background: #111b17; box-shadow: 0 14px 40px rgb(0 0 0 / 30%);
    }
    .prototype-switcher button { height: 44px; border: 0; color: #fff; background: transparent; font-size: 18px; }
    .prototype-switcher button:hover { background: #2b3b34; }
    .prototype-label { padding: 0 15px; color: #dce5e1; font-size: 12px; font-weight: 800; text-align: center; }

    @media (max-width: 1050px) {
      .a-topbar { grid-template-columns: 180px 1fr auto; }
      .a-nav { display: none; }
      .a-status { display: none; }
      .a-grid { grid-template-columns: 230px 1fr; }
      .a-grid > aside:last-child { display: none; }
      .roster-board { grid-template-columns: repeat(2, 1fr); }
      .slot-overview { grid-template-columns: 1fr; }
      .teams-layout { grid-template-columns: 1fr; }
      .b-player { grid-template-columns: 1fr 360px; gap: 24px; }
      .c-grid { grid-template-columns: 1fr 340px; }
    }
  </style>
</head>
<body>
  <main id="app" class="prototype-app"></main>

  <div id="modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <form class="modal" id="assign-form">
      <div class="modal-head">
        <div><div class="eyebrow">Registra acquisto</div><h2 id="modal-title">GIOCATORE_D_05</h2></div>
        <button class="icon-button" type="button" data-close-modal aria-label="Chiudi">×</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label for="team">Squadra acquirente</label>
          <select id="team" required>
            <option value="">Seleziona squadra…</option>
            <option>Atletico Bancone — la mia squadra</option>
            <option>Squadra 2</option><option>Squadra 3</option><option>Squadra 4</option>
            <option>Squadra 5</option><option>Squadra 6</option><option>Squadra 7</option><option>Squadra 8</option>
          </select>
        </div>
        <div class="field">
          <label for="price">Prezzo finale</label>
          <input id="price" type="number" min="1" max="1000" inputmode="numeric" placeholder="Crediti" required>
        </div>
        <div class="pill mint">Prezzo adattato 19 · massimo personale 877</div>
      </div>
      <div class="modal-actions">

    }

    function render() {
      const variant = currentVariant();
      document.getElementById('app').innerHTML = variant.key === 'A' ? VariantA() : variant.key === 'B' ? VariantB() : VariantC();
      document.getElementById('variant-label').textContent = `${variant.key} — ${variant.name}`;
      wireInteractions();
    }

    function cycle(direction) {
      const index = variants.findIndex(v => v.key === currentVariant().key);
      const next = variants[(index + direction + variants.length) % variants.length];
      const url = new URL(location.href);
      url.searchParams.set('variant', next.key);
      history.replaceState({}, '', url);
      render();
    }

    function selectPlayer(name) {
      selected = players.find(p => p.name === name) || selected;
      render();
    }

    function navigatePage(page) {
      const url = new URL(location.href);
      url.searchParams.set('variant', 'A');
      if (page === 'auction') url.searchParams.delete('page');
      else url.searchParams.set('page', page);
      history.replaceState({}, '', url);
      render();
      window.scrollTo(0, 0);
    }

    function wireInteractions() {
      document.querySelectorAll('[data-open-modal]').forEach(button => button.addEventListener('click', () => document.getElementById('modal').classList.add('open')));
      document.querySelectorAll('[data-player]').forEach(node => node.addEventListener('click', () => selectPlayer(node.dataset.player)));
      document.querySelectorAll('[data-page]').forEach(node => node.addEventListener('click', () => navigatePage(node.dataset.page)));
      document.querySelectorAll('[data-team]').forEach(node => node.addEventListener('click', () => { selectedTeam = teams.find(team => team.name === node.dataset.team) || selectedTeam; render(); }));
      document.querySelectorAll('.shortlist-toggle').forEach(button => button.addEventListener('click', () => { shortlistActive = !shortlistActive; render(); }));
      document.querySelectorAll('.player-search').forEach(input => {
        const results = input.nextElementSibling;
        input.addEventListener('focus', () => results.classList.add('open'));
        input.addEventListener('input', () => {
          const query = input.value.trim().toLowerCase();
          results.classList.add('open');
          results.querySelectorAll('.search-result').forEach(row => row.style.display = row.textContent.toLowerCase().includes(query) ? 'block' : 'none');
        });
        input.addEventListener('blur', () => setTimeout(() => results.classList.remove('open'), 120));
      });
    }

    document.getElementById('prev').addEventListener('click', () => cycle(-1));
    document.getElementById('next').addEventListener('click', () => cycle(1));
    document.querySelectorAll('[data-close-modal]').forEach(button => button.addEventListener('click', () => document.getElementById('modal').classList.remove('open')));
    document.getElementById('modal').addEventListener('click', event => { if (event.target.id === 'modal') event.currentTarget.classList.remove('open'); });
    document.getElementById('assign-form').addEventListener('submit', event => {
      event.preventDefault();
      document.getElementById('modal').classList.remove('open');
      const toast = document.getElementById('toast');
      toast.classList.add('open');
      setTimeout(() => toast.classList.remove('open'), 2200);
    });
    window.addEventListener('keydown', event => {
      if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName) || document.activeElement.isContentEditable) return;
      if (event.key === 'ArrowLeft') cycle(-1);
      if (event.key === 'ArrowRight') cycle(1);
      if (event.key === 'Escape') document.getElementById('modal').classList.remove('open');
    });
    window.addEventListener('popstate', render);
    render();
  </script>
</body>
</html>
