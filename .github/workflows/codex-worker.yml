name: Codex Worker

on:
  issues:
    types:
      - labeled

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: codex-worker-${{ github.repository }}
  cancel-in-progress: false

jobs:
  implement:
    if: >
      github.event.label.name == 'codex:queued' &&
      github.actor == 'ilNatalino'

    runs-on:
      - self-hosted
      - codex-local

    timeout-minutes: 60

    env:
      GH_TOKEN: ${{ github.token }}

      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      CODEX_MODEL_LOW: ${{ vars.CODEX_MODEL_LOW }}
      CODEX_MODEL_MEDIUM: ${{ vars.CODEX_MODEL_MEDIUM }}
      CODEX_MODEL_HIGH: ${{ vars.CODEX_MODEL_HIGH }}

    defaults:
      run:
        shell: bash

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      # ============================================================
      # PREFLIGHT
      # ============================================================

      - name: Check worker dependencies
        run: |
          echo "Checking worker dependencies..."

          git --version
          gh --version
          codex --version
          python3 --version

      # ============================================================
      # GIT CONFIG
      # ============================================================

      - name: Configure Git
        run: |
          git config user.name "codex-worker"
          git config user.email "codex-worker@users.noreply.github.com"

      # ============================================================
      # GENERATE BRANCH NAME
      #
      # Example:
      #
      # Issue #42
      # "Aggiungere filtri Segnalazioni"
      #
      # ->
      #
      # codex/42-aggiungere-filtri-segnalazioni
      # ============================================================

      - name: Generate branch name
        run: |
          python3 <<'PY'
          import os
          import re
          import unicodedata

          title = os.environ["ISSUE_TITLE"]
          issue_number = os.environ["ISSUE_NUMBER"]

          normalized = unicodedata.normalize("NFKD", title)
          normalized = normalized.encode(
              "ascii",
              "ignore"
          ).decode("ascii")

          slug = normalized.lower()
          slug = re.sub(r"[^a-z0-9]+", "-", slug)
          slug = slug.strip("-")

          slug = slug[:60].rstrip("-")

          if not slug:
              slug = "task"

          branch_name = f"codex/{issue_number}-{slug}"

          print(f"Branch name: {branch_name}")

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"BRANCH_NAME={branch_name}\n")
          PY

      # ============================================================
      # ISSUE STATUS -> RUNNING
      # ============================================================

      - name: Mark issue as running
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --remove-label "codex:queued" \
            --remove-label "codex:failed" \
            --remove-label "codex:done" \
            --remove-label "codex:review" \
            --add-label "codex:running"

      - name: Comment worker started
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Codex worker started processing this issue."

      # ============================================================
      # SELECT CODEX CONFIGURATION
      #
      # codex:low
      #   -> CODEX_MODEL_LOW
      #   -> reasoning high
      #
      # codex:medium
      #   -> CODEX_MODEL_MEDIUM
      #   -> reasoning low
      #
      # codex:high
      #   -> CODEX_MODEL_HIGH
      #   -> reasoning high
      #
      # No difficulty label:
      #   -> medium
      #
      # Multiple difficulty labels:
      #   -> fail
      # ============================================================

      - name: Select Codex configuration
        run: |
          python3 <<'PY'
          import json
          import os

          with open(os.environ["GITHUB_EVENT_PATH"], "r") as f:
              event = json.load(f)

          issue = event["issue"]

          labels = {
              label["name"]
              for label in issue.get("labels", [])
          }

          difficulty_labels = {
              "codex:low": "low",
              "codex:medium": "medium",
              "codex:high": "high",
          }

          selected = [
              difficulty
              for label, difficulty in difficulty_labels.items()
              if label in labels
          ]

          if len(selected) > 1:
              raise RuntimeError(
                  "Multiple Codex difficulty labels found. "
                  "Use only one of: "
                  "codex:low, codex:medium, codex:high."
              )

          # Default difficulty
          difficulty = selected[0] if selected else "medium"

          models = {
              "low": os.environ.get("CODEX_MODEL_LOW", ""),
              "medium": os.environ.get("CODEX_MODEL_MEDIUM", ""),
              "high": os.environ.get("CODEX_MODEL_HIGH", ""),
          }

          reasoning = {
              "low": "high",
              "medium": "low",
              "high": "high",
          }

          model = models[difficulty]
          effort = reasoning[difficulty]

          if not model:
              variable = f"CODEX_MODEL_{difficulty.upper()}"

              raise RuntimeError(
                  f"GitHub variable {variable} is not configured."
              )

          print("================================")
          print("Codex configuration")
          print("================================")
          print(f"Difficulty : {difficulty}")
          print(f"Model      : {model}")
          print(f"Reasoning  : {effort}")
          print("================================")

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"CODEX_DIFFICULTY={difficulty}\n")
              env.write(f"CODEX_MODEL={model}\n")
              env.write(f"CODEX_REASONING_EFFORT={effort}\n")
          PY

      # ============================================================
      # CREATE WORKING BRANCH
      # ============================================================

      - name: Create working branch
        run: |
          git fetch origin "$DEFAULT_BRANCH"

          git checkout -B \
            "$BRANCH_NAME" \
            "origin/$DEFAULT_BRANCH"

          echo
          echo "Working branch:"
          echo "$BRANCH_NAME"

      # ============================================================
      # BUILD CODEX PROMPT
      # ============================================================

      - name: Build Codex prompt
        run: |
          python3 <<'PY'
          import json
          import os

          with open(os.environ["GITHUB_EVENT_PATH"], "r") as f:
              event = json.load(f)

          issue = event["issue"]

          issue_number = issue["number"]
          issue_title = issue["title"]

          issue_body = (
              issue.get("body")
              or "No additional description provided."
          )

          prompt = f"""
          Implement GitHub issue #{issue_number}.

          # Issue title

          {issue_title}

          # Requirements

          {issue_body}

          # Repository instructions

          Before making changes:

          - Inspect the repository.
          - Understand the existing project structure.
          - Read AGENTS.md if present.
          - Follow all applicable AGENTS.md instructions.
          - Inspect existing implementations before creating new ones.

          # Implementation rules

          This is an implementation task.

          You must actually modify the repository when changes are
          required to satisfy the issue.

          Do not merely explain how the task could be implemented.

          Keep the implementation strictly focused on the issue.

          - Do not modify unrelated files.
          - Prefer existing components and utilities.
          - Prefer existing dependencies.
          - Follow the existing architecture.
          - Follow the existing coding style.
          - Keep the implementation simple.
          - Avoid unnecessary abstractions.
          - Do not introduce new dependencies unless clearly necessary.

          # Existing implementation

          Before implementing something new, verify whether the requested
          behavior already exists.

          If the issue is already completely satisfied by the current
          repository:

          - do not make artificial changes
          - do not modify files only to produce a Git diff
          - clearly state that no repository changes were required

          # Validation

          After implementation:

          - verify the requested behavior
          - run relevant tests when available
          - run lint when appropriate
          - run type checks when appropriate
          - fix errors introduced by your changes

          Before finishing, inspect the resulting working tree.

          # Git restrictions

          Do NOT:

          - create branches
          - create commits
          - push changes
          - create Pull Requests
          - modify Git configuration

          Git operations are handled externally by the worker.

          When implementation is complete, leave all repository
          modifications in the working tree.
          """

          path = "/tmp/codex-task.md"

          with open(path, "w") as f:
              f.write(prompt)

          print(f"Codex task written to {path}")
          PY

      # ============================================================
      # RUN CODEX
      # ============================================================

      - name: Run Codex
        run: |
          echo "================================"
          echo "Starting Codex"
          echo "================================"
          echo "Difficulty: $CODEX_DIFFICULTY"
          echo "Model:      $CODEX_MODEL"
          echo "Reasoning:  $CODEX_REASONING_EFFORT"
          echo "================================"

          cat /tmp/codex-task.md | \
            codex \
              --ask-for-approval never \
              exec \
              --model "$CODEX_MODEL" \
              --config "model_reasoning_effort=\"$CODEX_REASONING_EFFORT\"" \
              --sandbox workspace-write \
              - \
              2>&1 | tee /tmp/codex-output.log

      # ============================================================
      # INSPECT RESULT
      # ============================================================

      - name: Show generated changes
        run: |
          echo "================================"
          echo "Git status"
          echo "================================"

          git status \
            --short \
            --untracked-files=all

          echo
          echo "================================"
          echo "Diff statistics"
          echo "================================"

          git diff --stat

          echo
          echo "================================"
          echo "Changed files"
          echo "================================"

          git diff --name-only

      # ============================================================
      # DETECT CHANGES
      # ============================================================

      - name: Detect repository changes
        run: |
          git add -A

          echo "Staged changes:"
          git diff --cached --name-status

          if git diff --cached --quiet; then
            echo
            echo "Codex produced no repository changes."
            echo "HAS_CHANGES=false" >> "$GITHUB_ENV"
          else
            echo
            echo "Codex produced repository changes."
            echo "HAS_CHANGES=true" >> "$GITHUB_ENV"
          fi

      # ============================================================
      # NO CHANGES
      # ============================================================

      - name: Mark issue as done without changes
        if: env.HAS_CHANGES == 'false'
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --remove-label "codex:running" \
            --add-label "codex:done"

      - name: Comment no changes required
        if: env.HAS_CHANGES == 'false'
        run: |
          {
            echo "Codex completed the task but no repository changes were required."
            echo
            echo "### Codex configuration"
            echo
            echo "- Difficulty: \`${CODEX_DIFFICULTY}\`"
            echo "- Model: \`${CODEX_MODEL}\`"
            echo "- Reasoning: \`${CODEX_REASONING_EFFORT}\`"
            echo
            echo "This normally means:"
            echo
            echo "- the requested implementation already exists"
            echo "- the repository already satisfies the issue"
            echo "- no modification was necessary"
            echo
            echo "### Codex output"
            echo

            if [ -f /tmp/codex-output.log ]; then
              tail -n 40 /tmp/codex-output.log | sed 's/^/> /'
            else
              echo "> No Codex output available."
            fi

          } > /tmp/no-change-comment.md

          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/no-change-comment.md

      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit changes
        if: env.HAS_CHANGES == 'true'
        run: |
          git commit \
            -m "feat: implement issue #${ISSUE_NUMBER}"

      # ============================================================
      # PUSH
      # ============================================================

      - name: Push branch
        if: env.HAS_CHANGES == 'true'
        run: |
          git push \
            --set-upstream origin \
            "$BRANCH_NAME"

      # ============================================================
      # CREATE PULL REQUEST
      # ============================================================

      - name: Create Pull Request
        if: env.HAS_CHANGES == 'true'
        run: |
          cat > /tmp/pr-body.md <<EOF
          Automated implementation for #${ISSUE_NUMBER}.

          ## Source

          GitHub Issue: #${ISSUE_NUMBER}

          ## Codex configuration

          Difficulty: \`${CODEX_DIFFICULTY}\`

          Model: \`${CODEX_MODEL}\`

          Reasoning effort: \`${CODEX_REASONING_EFFORT}\`

          ## Worker

          This implementation was generated by the local Codex worker.

          Branch:

          \`${BRANCH_NAME}\`

          ## Review

          This Pull Request requires manual review and manual merge.

          Closes #${ISSUE_NUMBER}
          EOF

          PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$DEFAULT_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "Codex: $ISSUE_TITLE" \
            --body-file /tmp/pr-body.md)

          echo "PR_URL=$PR_URL" >> "$GITHUB_ENV"

          echo
          echo "Pull Request created:"
          echo "$PR_URL"

      # ============================================================
      # SUCCESS
      # ============================================================

      - name: Mark issue ready for review
        if: env.HAS_CHANGES == 'true' && success()
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --remove-label "codex:running" \
            --add-label "codex:review"

      - name: Comment successful execution
        if: env.HAS_CHANGES == 'true' && success()
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Codex completed the implementation successfully.

          Difficulty: \`${CODEX_DIFFICULTY}\`
          Model: \`${CODEX_MODEL}\`
          Reasoning: \`${CODEX_REASONING_EFFORT}\`

          Branch: \`${BRANCH_NAME}\`

          Pull Request: ${PR_URL}

          The changes are ready for manual review."

      # ============================================================
      # FAILURE
      # ============================================================

      - name: Mark issue as failed
        if: failure()
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --remove-label "codex:running" \
            --remove-label "codex:queued" \
            --add-label "codex:failed" \
            || true

      - name: Comment failed execution
        if: failure()
        run: |
          {
            echo "Codex worker failed while processing this issue."
            echo
            echo "Check the GitHub Actions execution logs for complete details."

            if [ -n "${CODEX_MODEL:-}" ]; then
              echo
              echo "### Codex configuration"
              echo
              echo "- Difficulty: \`${CODEX_DIFFICULTY:-unknown}\`"
              echo "- Model: \`${CODEX_MODEL:-unknown}\`"
              echo "- Reasoning: \`${CODEX_REASONING_EFFORT:-unknown}\`"
            fi

            if [ -f /tmp/codex-output.log ]; then
              echo
              echo "### Last Codex output"
              echo

              tail -n 40 /tmp/codex-output.log | sed 's/^/> /'
            fi

          } > /tmp/failure-comment.md

          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/failure-comment.md \
            || true