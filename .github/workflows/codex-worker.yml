name: Codex Worker

on:
  issues:
    types:
      - labeled

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  implement:
    if: github.event.label.name == 'codex:queued'

    runs-on:
      - self-hosted
      - codex-local

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      BRANCH_NAME: codex/issue-${{ github.event.issue.number }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Configure Git
        run: |
          git config user.name "codex-worker"
          git config user.email "codex-worker@users.noreply.github.com"

      - name: Mark issue as running
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --remove-label "codex:queued" \
            --add-label "codex:running"

      - name: Create branch
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -b "$BRANCH_NAME" "origin/$DEFAULT_BRANCH"

      - name: Build Codex prompt
        run: |
          python3 <<'PY'
          import json
          import os

          with open(os.environ["GITHUB_EVENT_PATH"], "r") as f:
              event = json.load(f)

          issue = event["issue"]

          prompt = f"""
          Implement GitHub issue #{issue["number"]}.

          # Title

          {issue["title"]}

          # Requirements

          {issue.get("body") or "No additional description provided."}

          # Working instructions

          - Inspect the existing repository before making changes.
          - Follow AGENTS.md instructions if present.
          - Keep the implementation focused on this issue.
          - Do not modify unrelated code.
          - Prefer the existing project architecture and dependencies.
          - Keep the solution simple and maintainable.
          - Run relevant tests, linting or type checks when appropriate.
          - Do not create Git commits.
          - Do not push anything to GitHub.
          - Do not create a Pull Request.

          Git operations are handled externally by the worker.
          """

          with open("/tmp/codex-task.md", "w") as f:
              f.write(prompt)
          PY

      - name: Run Codex
        run: |
          cat /tmp/codex-task.md | \
          codex --ask-for-approval never exec \
            --sandbox workspace-write \
            -

      - name: Show changes
        run: |
          git status
          git diff --stat
          git diff

      - name: Commit changes
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "Codex produced no changes."
            exit 1
          fi

          git commit \
            -m "feat: implement issue #${ISSUE_NUMBER}"

      - name: Push branch
        run: |
          git push \
            --set-upstream origin \
            "$BRANCH_NAME"

      - name: Create Pull Request
        run: |
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$DEFAULT_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "Codex: ${{ github.event.issue.title }}" \
            --body "Automated implementation for #${ISSUE_NUMBER}.

          This Pull Request was generated by the local Codex worker.

          Closes #${ISSUE_NUMBER}"

      - name: Mark issue ready for review
        if: success()
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --remove-label "codex:running" \
            --add-label "codex:review"

      - name: Mark issue as failed
        if: failure()
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --remove-label "codex:running" \
            --add-label "codex:failed"